[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fraudshield-python"
version = "0.2.0"
description = "Explainable fraud-risk decisions with idempotent transaction processing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.7,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "confluent-kafka>=2.5,<3", "temporalio>=1.8,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1", "pytest-asyncio>=0.24,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/fraudshield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]